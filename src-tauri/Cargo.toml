[package]
name = "boreal-pms"
version = "0.1.0"
description = "Sistema de gestão de pousada (PMS)"
authors = ["Boreal"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "boreal_pms_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = "4.2.0"
rand = "0.10.3"
thiserror = "2.0.21"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
argon2 = "0.6.0"
base64 = "0.23.1"
unicode-normalization = "0.1.26"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# Argon2 em debug é lento demais para os testes
[profile.dev.package.argon2]
opt-level = 3
